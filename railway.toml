[build]
builder = "RAILPACK"
# Railway has no equivalent of Render's checksPass gate, so it keeps the
# in-host test run and therefore needs the dev-only test dependencies.
buildCommand = "pip install -r requirements-dev.txt && python scripts/build_rag_index.py && RAG_BACKEND=lexical python -m pytest -q"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
